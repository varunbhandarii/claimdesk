name: claimdesk_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0
  image: ^4.10.1
  timezone: ^0.11.0
  serverpod: 4.0.2
  serverpod_auth_idp_server: 4.0.2
  serverpod_cloud_storage: 4.0.2
  porter_2_stemmer: ^3.0.2

dev_dependencies:
  barcode: ^2.2.9
  lints: '>=3.0.0 <7.0.0'
  serverpod_test: 4.0.2
  test: ^1.25.5

serverpod:
  scripts:
    seed: dart run bin/seed.dart --apply-migrations
    # Build the Flutter web app and copy it to the server's web directory.
    # Copy the verified build on Windows, where --output is unreliable.
    # See: https://github.com/flutter/flutter/issues/157886
    # The POSIX command retries after cleaning on a failed build.
    flutter_build:
      windows: powershell -NoProfile -ExecutionPolicy Bypass -File tool/build_web.ps1
      posix: |
        rm -rf ../claimdesk_server/web/app
        cd ../claimdesk_flutter
        set -- web --base-href /app/ --output ../claimdesk_server/web/app
        flutter build "$@" || { flutter clean && flutter build "$@"; }

  # Companion Flutter apps that `serverpod start` can launch (Ctrl+R), keyed
  # by a display alias. The default device is the web server, opening the
  # machine's default browser when ready. All non-reserved properties are
  # forwarded to `flutter run`. For the best IDE debugging experience, use
  # `chrome` or a native target as the device. See the example below:
  #
  # Admin:
  #   path: ../apps/admin_flutter
  #   displayName: "Admin app"
  #   auto_launch: true
  #   device: chrome
  #   target: lib/main.dart
  #   web-hostname: 0.0.0.0
  #   web-port: 8090
  #   release: true
  #   pub: false
  #   dart-define:
  #     API_URL=https://admin.example.com
  #     FLAVOR=production
  flutter_apps:
    claimdesk:
      path: ../claimdesk_flutter
      displayName: "Claimdesk app"
      auto_launch: true
      device: chrome
      target: lib/driver.dart
    phone:
      path: ../claimdesk_flutter
      displayName: "ClaimDesk phone"
      auto_launch: false
      device: RZCX625LT5P
      target: lib/driver.dart
      dart-define: SERVER_URL=http://127.0.0.1:8080/
