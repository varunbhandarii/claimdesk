name: Staff app
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze staff app
        working-directory: claimdesk_flutter
        run: flutter analyze
      - name: Test staff app
        working-directory: claimdesk_flutter
        run: flutter test
